[workspace]
name = "genotype-phasing-smk-envs"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]
exclude-newer = "7d"

[dependencies]
bcftools = "*"
htslib = "*"
plink2 = "*"

# SHAPEIT5 pins htslib below 1.25, so it stays out of default.
[feature.shapeit5.dependencies]
shapeit5 = "*"

[environments]
shapeit5 = { features = ["shapeit5"], no-default-feature = true }

[exclude-newer]
ca-certificates = "0d"
certifi = "0d"
pip = "0d"
bcftools = "0d"
htslib = "0d"

[pypi-exclude-newer]
certifi = "0d"
pip = "0d"
