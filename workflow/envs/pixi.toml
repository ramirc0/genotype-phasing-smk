[workspace]
name = "genotype-phasing-smk-envs"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]
exclude-newer = "7d"
preview = ["pixi-build"]

[dependencies]
bcftools = "*"
htslib = "*"
plink2 = "*"
admixture = "*"
rfmix = "*"
python = "3.13.*"
polars = "*"
matplotlib = ">=3.11"
pypdf = "*"

[pypi-dependencies]
poikilos = { git = "https://github.com/ramirc0/poikilos" }
pqplot = ">=0.3"

# Rule jobs only save figures. Without this, a job that inherits DISPLAY picks a GUI backend.
[activation.env]
MPLBACKEND = "Agg"

# SHAPEIT5 and Eagle2 pin htslib below 1.25, so they stay out of default.
[feature.shapeit5.dependencies]
shapeit5 = "*"

[feature.eagle2.dependencies]
eagle2 = "*"

# gnomix has no package, so workflow/envs/gnomix/ builds one from a pinned commit.
[feature.gnomix.dependencies]
gnomix = { path = "gnomix" }
bcftools = "*"
python = "3.13.*"
# scikit-allel accepts any dask. Unpinned, the solver picks 2023.3, whose dask.array imports numpy.compat, gone in numpy 2.
dask-core = ">=2025"

[environments]
shapeit5 = { features = ["shapeit5"], no-default-feature = true }
eagle2 = { features = ["eagle2"], no-default-feature = true }
gnomix = { features = ["gnomix"], no-default-feature = true }

[exclude-newer]
ca-certificates = "0d"
certifi = "0d"
pip = "0d"
bcftools = "0d"
htslib = "0d"

[pypi-exclude-newer]
certifi = "0d"
pip = "0d"
pqplot = "0d"
