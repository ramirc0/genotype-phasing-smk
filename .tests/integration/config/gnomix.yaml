# gnomix settings for the toy span, which covers about 0.7 cM.
verbose: True
seed: 1
simulation:
  run: True
  path:
  splits:
    ratios: {train1: 0.8, train2: 0.2, val: 0}
  gens: [0, 2, 4, 8, 16]
  r_admixed: 0.5
  rm_data: True
model:
  name: model
  inference:
  window_size_cM: 0.02
  smooth_size: 9
  windowed_loading: False
  context_ratio: 0.5
  retrain_base: True
  calibrate: False
  n_cores:
inference:
  bed_file_output: False
  snp_level_inference: False
  visualize_inference: False
