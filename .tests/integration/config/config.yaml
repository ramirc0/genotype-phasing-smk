outdir: results
pixi_env: default
run_id: default

callset: resources/callset.vcf.gz
fasta: resources/reference.fa.gz
exclude_samples: config/exclude_samples.tsv
chromosomes: [chr20]

phaser: shapeit5
panel: resources/panel/{region}.bcf
genetic_maps:
  shapeit5: resources/maps/{region}.b38.gmap.gz
  eagle2: resources/maps/genetic_map_hg38_withX.txt.gz

array_manifest: resources/Multi-EthnicGlobal_D2.csv
long_range_ld: resources/high-LD-regions-hg38-GRCh38.bed
kinship_cutoff: 0.354    # the toy data has too few SNPs to estimate kinship below duplicates
num_pcs: 5

panel_metadata: resources/panel/gnomad_meta_updated.tsv
local_ancestry:
  tool: rfmix2
  populations:
    AFR: [YRI, ESN, GWD, MSL, LWK, Yoruba, Mandenka]
    EUR: [CEU, GBR, IBS, TSI, French, Italian, Tuscan, Basque, Orcadian, Sardinian, Russian]
    NAT: [PEL, MXL, Maya, Pima, Karitiana, Surui, Colombian]
  min_purity: {AFR: 0.5, EUR: 0.5, NAT: 0.5}   # the toy span has too few SNPs for SOP purity
  rfmix_generations: 8
seed: 1

filters:
  min_dp: 10
  min_maf: 0.01
  max_missing: 0.05
