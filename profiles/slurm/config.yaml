executor: slurm
software-deployment-method:
  - pixi
# Snakemake copies every env package here. pixi installs from its own cache.
# One copy per user instead of one per workdir.
software-deployment-cache-prefix: ~/.cache/snakemake/software

jobs: 250
# Job selection reruns once per timespan and stats every ready job's input on
# NFS. At 1s, a driver with more ready jobs than slots pins a login-node core.
max-jobs-per-timespan: 50/10s
# ILP re-solves a model per batch of finished jobs. It only pays off with temp()
# outputs. Greedy starts big-input jobs first, so give a small blocking rule `priority:`.
scheduler: greedy

slurm-efficiency-report: true
slurm-efficiency-report-path: logs/efficiency
slurm-efficiency-threshold: 0.8
slurm-init-seconds-before-status-checks: 10
# NODE_FAIL nodes join this list. An --exclude in slurm_extra would override it.
# z1072 and z1076 cannot read /data, and it hangs on z1024. z1056 and z1081 lost their /data mount on 2026-11-05.
slurm-exclude-failed-nodes: z1024,z1056,z1072,z1076,z1081

# Scheduling is FIFO plus backfill. A job may start in any partition whose time
# limit fits its runtime, so each lists them all.
default-resources:
  runtime: 30m
  mem_mb: 4000 * attempt
  slurm_partition: 30mins,4hours,12hours,5days

set-threads:
  prepare_genotypes: 4
  phase_shapeit5: 16
  phase_chrx_chunk: 16
  ligate_chrx: 4
  phase_rare: 8
  phase_eagle2: 16
  infer_x_ploidy: 2
  concat_chrx: 2
  finalize_phased: 4
  gather_phased: 4
  export_pgen: 4
  array_genotypes: 2
  cohort_array_pgen: 8
  relatedness: 8
  genetic_pcs: 8
  reference_candidates: 1
  match_array_sites: 2
  make_lai_maps: 1
  admixture: 16
  select_reference: 1
  local_ancestry_rfmix2: 16
  local_ancestry_gnomix: 16
  local_ancestry_flare: 16
  flare_msp: 1
  plot_local_ancestry: 1
  extract_tracts: 1

set-resources:              # about twice each rule's peak in the 936-sample runs' benchmarks/, 5-way included
  prepare_genotypes:
    mem_mb: 4000 * attempt
    runtime: 60m
    slurm_partition: 4hours,12hours,5days
  phase_shapeit5:
    mem_mb: 48000 * attempt
    runtime: 600m
    slurm_partition: 12hours,5days
  chrx_chunks:
    mem_mb: 2000 * attempt
    runtime: 30m
  phase_chrx_chunk:
    mem_mb: 24000 * attempt
    runtime: 60m
    slurm_partition: 4hours,12hours,5days
  ligate_chrx:
    mem_mb: 2000 * attempt
    runtime: 30m
  phase_rare:
    mem_mb: 8000 * attempt
    runtime: 150m
    slurm_partition: 4hours,12hours,5days
  phase_eagle2:
    mem_mb: 64000 * attempt
    runtime: 720m
    slurm_partition: 12hours,5days
  infer_x_ploidy:
    mem_mb: 2000 * attempt
    runtime: 30m
  concat_chrx:
    mem_mb: 2000 * attempt
    runtime: 30m
  finalize_phased:
    mem_mb: 2000 * attempt
    runtime: 30m
  gather_phased:
    mem_mb: 2000 * attempt
    runtime: 120m
    slurm_partition: 4hours,12hours,5days
  export_pgen:
    mem_mb: 4000 * attempt
    runtime: 30m
  array_genotypes:
    mem_mb: 2000 * attempt
    runtime: 30m
  cohort_array_pgen:
    mem_mb: 4000 * attempt
    runtime: 30m
  relatedness:
    mem_mb: 4000 * attempt
    runtime: 30m
  genetic_pcs:
    mem_mb: 4000 * attempt
    runtime: 30m
  reference_candidates:
    mem_mb: 2000 * attempt
    runtime: 30m
  match_array_sites:
    mem_mb: 2000 * attempt
    runtime: 30m
  make_lai_maps:
    mem_mb: 2000 * attempt
    runtime: 30m
  admixture:
    mem_mb: 4000 * attempt
    runtime: 120m
    slurm_partition: 4hours,12hours,5days
  select_reference:
    mem_mb: 2000 * attempt
    runtime: 30m
  local_ancestry_rfmix2:
    mem_mb: 8000 * attempt
    runtime: 180m
    slurm_partition: 4hours,12hours,5days
  local_ancestry_gnomix:
    mem_mb: 64000 * attempt
    runtime: 720m
    slurm_partition: 12hours,5days
  # No benchmark yet: sized like RFMix2, to tune after the first run.
  local_ancestry_flare:
    mem_mb: 16000 * attempt
    runtime: 120m
    slurm_partition: 4hours,12hours,5days
  flare_msp:
    mem_mb: 8000 * attempt
    runtime: 30m
  plot_local_ancestry:
    mem_mb: 20000 * attempt
    runtime: 60m
    slurm_partition: 4hours,12hours,5days
  extract_tracts:
    mem_mb: 2000 * attempt
    runtime: 300m
    slurm_partition: 12hours,5days

rerun-incomplete: true
keep-going: true
show-failed-logs: true
benchmark-extended: true
retries: 1
slurm-requeue: false
printshellcmds: true
latency-wait: 60
