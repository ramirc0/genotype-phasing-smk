executor: slurm
software-deployment-method:
  - pixi
# Snakemake copies every env package here. pixi installs from its own cache.
# One copy per user instead of one per workdir.
software-deployment-cache-prefix: ~/.cache/snakemake/software

jobs: 250
# Job selection reruns once per timespan and stats every ready job's input on
# NFS. At 1s, a driver with more ready jobs than slots pins a login-node core.
max-jobs-per-timespan: 50/10s
# ILP re-solves a model per batch of finished jobs. It only pays off with temp()
# outputs. Greedy starts big-input jobs first, so give a small blocking rule `priority:`.
scheduler: greedy

slurm-efficiency-report: true
slurm-efficiency-report-path: logs/efficiency
slurm-efficiency-threshold: 0.8
slurm-init-seconds-before-status-checks: 10
# NODE_FAIL nodes join this list. An --exclude in slurm_extra would override it.
# z1076 cannot read /data. z1056 and z1081 lost their /data mount on 2026-11-05.
slurm-exclude-failed-nodes: z1056,z1076,z1081

default-resources:
  runtime: 30m
  mem_mb: 4000 * attempt

set-threads:
  prepare_genotypes: 4
  phase_shapeit5: 16
  phase_eagle2: 16
  finalize_phased: 4
  export_pgen: 4
  array_genotypes: 2
  cohort_array_pgen: 8
  relatedness: 8
  genetic_pcs: 8
  reference_candidates: 1
  match_array_sites: 2
  make_lai_maps: 1
  admixture: 16
  select_reference: 1
  local_ancestry_rfmix2: 16
  plot_local_ancestry: 1

set-resources:              # tune from benchmarks/ TSVs after a real run
  prepare_genotypes:
    mem_mb: 8000 * attempt
    runtime: 720m
    slurm_partition: 12hours
  phase_shapeit5:
    mem_mb: 64000 * attempt
    runtime: 720m
    slurm_partition: 12hours
  phase_eagle2:
    mem_mb: 64000 * attempt
    runtime: 720m
    slurm_partition: 12hours
  finalize_phased:
    mem_mb: 4000 * attempt
    runtime: 240m
    slurm_partition: 4hours
  export_pgen:
    mem_mb: 16000 * attempt
    runtime: 240m
    slurm_partition: 4hours
  array_genotypes:
    mem_mb: 4000 * attempt
    runtime: 240m
    slurm_partition: 4hours
  cohort_array_pgen:
    mem_mb: 16000 * attempt
    runtime: 240m
    slurm_partition: 4hours
  relatedness:
    mem_mb: 16000 * attempt
    runtime: 240m
    slurm_partition: 4hours
  genetic_pcs:
    mem_mb: 16000 * attempt
    runtime: 240m
    slurm_partition: 4hours
  reference_candidates:
    mem_mb: 4000 * attempt
    runtime: 30m
  match_array_sites:
    mem_mb: 4000 * attempt
    runtime: 240m
    slurm_partition: 4hours
  make_lai_maps:
    mem_mb: 2000 * attempt
    runtime: 30m
  admixture:
    mem_mb: 32000 * attempt
    runtime: 720m
    slurm_partition: 12hours
  select_reference:
    mem_mb: 4000 * attempt
    runtime: 30m
  local_ancestry_rfmix2:
    mem_mb: 64000 * attempt
    runtime: 720m
    slurm_partition: 12hours
  plot_local_ancestry:
    mem_mb: 32000 * attempt
    runtime: 240m
    slurm_partition: 4hours

rerun-incomplete: true
keep-going: true
show-failed-logs: true
benchmark-extended: true
retries: 1
slurm-requeue: false
printshellcmds: true
latency-wait: 60
