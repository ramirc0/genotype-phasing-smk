# Local execution.
software-deployment-method:
  - pixi
# Snakemake copies every env package here. pixi installs from its own cache.
# One copy per user instead of one per workdir.
software-deployment-cache-prefix: ~/.cache/snakemake/software

cores: 16
printshellcmds: true
# Job selection reruns once per timespan and stats every ready job's input on
# NFS. At 1s, a driver with more ready jobs than slots pins a login-node core.
max-jobs-per-timespan: 50/10s
rerun-incomplete: true
keep-going: true
show-failed-logs: true
retries: 1
benchmark-extended: true

default-resources:
  mem_mb: 4000
  runtime: 30

set-threads:
  prepare_genotypes: 4
  phase_shapeit5: 8
  phase_chrx_chunk: 8
  ligate_chrx: 2
  phase_rare: 2
  phase_eagle2: 8
  infer_x_ploidy: 2
  concat_chrx: 2
  finalize_phased: 2
  gather_phased: 2
  export_pgen: 4
  array_genotypes: 2
  cohort_array_pgen: 8
  relatedness: 8
  genetic_pcs: 8
  reference_candidates: 1
  match_array_sites: 2
  make_lai_maps: 1
  admixture: 8
  select_reference: 1
  local_ancestry_rfmix2: 8
  local_ancestry_gnomix: 8
  local_ancestry_flare: 2
  flare_msp: 1
  plot_local_ancestry: 1
  extract_tracts: 1

set-resources:
  prepare_genotypes: {mem_mb: 4000}
  phase_shapeit5: {mem_mb: 16000}
  phase_eagle2: {mem_mb: 16000}
  infer_x_ploidy: {mem_mb: 4000}
  concat_chrx: {mem_mb: 2000}
  finalize_phased: {mem_mb: 2000}
  export_pgen: {mem_mb: 8000}
  array_genotypes: {mem_mb: 2000}
  cohort_array_pgen: {mem_mb: 8000}
  relatedness: {mem_mb: 8000}
  genetic_pcs: {mem_mb: 8000}
  reference_candidates: {mem_mb: 2000}
  match_array_sites: {mem_mb: 2000}
  make_lai_maps: {mem_mb: 1000}
  admixture: {mem_mb: 8000}
  select_reference: {mem_mb: 2000}
  local_ancestry_rfmix2: {mem_mb: 16000}
  local_ancestry_gnomix: {mem_mb: 16000}
  plot_local_ancestry: {mem_mb: 8000}
  extract_tracts: {mem_mb: 2000}
